# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: HPSS Lab | Colorado School of Mines
email: belviranli@mines.edu
description: > # this means to ignore newlines until "baseurl:"
  The High Performance Systems and Software Lab at Colorado School of Mines studies
  heterogeneous computing, autonomous systems, and computer architecture.
baseurl: ""
url: "https://hpss.mines.edu"

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

research_interest_form: "https://docs.google.com/forms/d/19r43_vTEsu_fKLOEXbdAVJgvMaIiMU7mT20WU1hEvDg/viewform"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - vendor
  - _pages/pictures.md
  - _pages/mini_lecture_series.md
  - _pages/aboutwebsite.md
